name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "_data/**"
      - "_includes/**"
      - "_layouts/**"
      - "_pages/**"
      - "_plugins/**"
      - "_posts/**"
      - "_sass/**"
      - "_scripts/**"
      - "tests/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
  pull_request:
    branches: [main]
    paths:
      - "assets/**"
      - "_data/**"
      - "_includes/**"
      - "_layouts/**"
      - "_pages/**"
      - "_plugins/**"
      - "_posts/**"
      - "_sass/**"
      - "_scripts/**"
      - "tests/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Verify stylesheet cache invalidation
        run: bundle exec ruby tests/cache-bust.test.rb
      - name: Verify original portrait rendering
        run: bundle exec ruby tests/portrait-render.test.rb
      - name: Verify mobile CV rendering
        run: bundle exec ruby tests/cv-mobile-render.test.rb
      - name: Verify related reading navigation
        run: bundle exec ruby tests/related-posts-render.test.rb
      - name: Verify name-first brand rendering
        run: bundle exec ruby tests/brand-render.test.rb
      - name: Verify reading lists and navigation rendering
        run: bundle exec ruby tests/navigation-render.test.rb
      - name: Verify site and reading interactions
        run: node --test tests/*.test.mjs
      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Verify published site addresses
        run: bundle exec ruby tests/site-address-build.test.rb
      - name: Verify navigation and recovery pages
        run: bundle exec ruby tests/navigation-build.test.rb
      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: _site
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: _site
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: _site
